<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <header>
    <h1>My Library</h1>
    <button id="new-book-btn">New Book</button>
  </header>

  <!-- Container for rendered book cards -->
  <main id="library-container"></main>

  <!-- Popup Form Dialog -->
  <dialog id="book-dialog">
    <form id="book-form">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Title" required />

      <label for="author">Author</label>
      <input type="text" id="author" placeholder="Author" required />

      <label for="pages">Pages</label>
      <input type="number" id="pages" placeholder="Pages" required />

      <label>
        <input type="checkbox" id="read" /> Have you read it?
      </label>

      <button type="submit">Add Book</button>
      <button type="button" id="close-dialog">Cancel</button>
    </form>
  </dialog>

</body>
</html>
